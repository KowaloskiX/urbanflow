[project]
name = "urbanflow-backend"
version = "0.1.0"
description = "UrbanFlow dispatcher support API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "gtfs-realtime-bindings>=1.0,<2.0",
    "httpx>=0.28,<1.0",
    "pydantic>=2.10,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<10.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]
